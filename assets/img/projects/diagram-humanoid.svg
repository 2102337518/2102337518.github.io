<line x1="735" y1="148" x2="815" y2="230" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="1025" y1="148" x2="1075" y2="230" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="170" y1="358" x2="300" y2="390" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<text x="235.0" y="368.0" text-anchor="middle" font-size="11" fill="#57606a">z + ê</text>
<line x1="170" y1="358" x2="360" y2="470" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<text x="265.0" y="408.0" text-anchor="middle" font-size="11" fill="#57606a">z（20 维）</text>
<line x1="500" y1="548" x2="500" y2="610" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="860" y1="294" x2="1010" y2="294" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="815" y1="358" x2="690" y2="470" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<text x="752.5" y="408.0" text-anchor="middle" font-size="11" fill="#57606a">value</text>
<line x1="170" y1="358" x2="30" y2="470" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="1085" y1="358" x2="310" y2="470" stroke="#7a8694" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/>
<text x="697.5" y="408.0" text-anchor="middle" font-size="11" fill="#57606a">风格奖励</text>
<line x1="310" y1="420" x2="360" y2="420" stroke="#7a8694" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/>
<line x1="310" y1="548" x2="360" y2="548" stroke="#7a8694" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/>
