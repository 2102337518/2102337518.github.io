<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Lato,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1240" height="720" fill="#ffffff"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#7a8694"/></marker>
</defs>
<text x="620.0" y="40" text-anchor="middle" font-size="21" font-weight="900" fill="#0b5394">Humanoid Locomotion · TKE-AMP Architecture（PPO）</text>
<rect x="30" y="70" width="250" height="78" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="155.0" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">长历史观测</text>
<text x="155.0" y="122" text-anchor="middle" font-size="12.5" fill="#24292f">78 维 × 10 帧 = 780</text>
<rect x="320" y="70" width="250" height="78" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="445.0" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">短历史观测</text>
<text x="445.0" y="122" text-anchor="middle" font-size="12.5" fill="#24292f">78 维 × 2 帧 = 156</text>
<rect x="610" y="70" width="250" height="78" rx="10" fill="#eef6ee" stroke="#2f7d5a" stroke-width="1.5"/>
<text x="735.0" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">特权观测（Critic）</text>
<text x="735.0" y="122" text-anchor="middle" font-size="12.5" fill="#24292f">113 维 / 帧</text>
<rect x="900" y="70" width="250" height="78" rx="10" fill="#eef6ee" stroke="#2f7d5a" stroke-width="1.5"/>
<text x="1025.0" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">AMP 观测</text>
<text x="1025.0" y="122" text-anchor="middle" font-size="12.5" fill="#24292f">74 维 × 6 帧 = 444</text>
<rect x="30" y="230" width="280" height="128" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="170.0" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">① TKE 状态估计器</text>
<text x="170.0" y="282" text-anchor="middle" font-size="12.5" fill="#24292f">Encoder MLP 512-256-128</text>
<text x="170.0" y="300" text-anchor="middle" font-size="12.5" fill="#24292f">潜变量 z（20 维，VAE）</text>
<text x="170.0" y="318" text-anchor="middle" font-size="12.5" fill="#24292f">显式估计 ê（预留）</text>
<rect x="360" y="230" width="280" height="128" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="500.0" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">② Predictor 解码器</text>
<text x="500.0" y="282" text-anchor="middle" font-size="12.5" fill="#24292f">AutoEncoder MLP 128-64</text>
<text x="500.0" y="300" text-anchor="middle" font-size="12.5" fill="#24292f">重建下一帧本体观测</text>
<text x="500.0" y="318" text-anchor="middle" font-size="12.5" fill="#24292f">辅助监督（系数 0.1）</text>
<rect x="690" y="230" width="250" height="128" rx="10" fill="#eef6ee" stroke="#2f7d5a" stroke-width="1.5"/>
<text x="815.0" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">③ Critic 价值网络</text>
<text x="815.0" y="282" text-anchor="middle" font-size="12.5" fill="#24292f">MLP 1024-512-256-128</text>
<text x="815.0" y="300" text-anchor="middle" font-size="12.5" fill="#24292f">113 → V(s)</text>
<rect x="975" y="230" width="250" height="128" rx="10" fill="#eef6ee" stroke="#2f7d5a" stroke-width="1.5"/>
<text x="1100.0" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b4a">④ AMP 判别器</text>
<text x="1100.0" y="282" text-anchor="middle" font-size="12.5" fill="#24292f">MLP 1024-512-256</text>
<text x="1100.0" y="300" text-anchor="middle" font-size="12.5" fill="#24292f">→ 风格奖励 logit</text>
<rect x="360" y="420" width="280" height="128" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="500.0" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">⑤ Actor 策略网络</text>
<text x="500.0" y="472" text-anchor="middle" font-size="12.5" fill="#24292f">MLP 2048-1024-512-128</text>
<text x="500.0" y="490" text-anchor="middle" font-size="12.5" fill="#24292f">输入 176 = 短历史 156 + z 20</text>
<text x="500.0" y="508" text-anchor="middle" font-size="12.5" fill="#24292f">输出 23 维关节位置目标 + std</text>
<rect x="360" y="610" width="280" height="78" rx="10" fill="#eaf2fb" stroke="#1772d0" stroke-width="1.5"/>
<text x="500.0" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5394">位置式 PD 控制</text>
<text x="500.0" y="662" text-anchor="middle" font-size="12.5" fill="#24292f">4 子步 × dt 0.005s → 机器人</text>
<rect x="30" y="420" width="280" height="128" rx="10" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="170.0" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d1a">PPO 统一更新</text>
<text x="170.0" y="472" text-anchor="middle" font-size="12.5" fill="#24292f">Actor / Critic / 判别器 / 估计器</text>
<text x="170.0" y="490" text-anchor="middle" font-size="12.5" fill="#24292f">4 epoch × 4 minibatch</text>
<text x="170.0" y="508" text-anchor="middle" font-size="12.5" fill="#24292f">镜像对称约束 + cmd_pool</text>
<line x1="155" y1="148" x2="170" y2="230" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
<line x1="445" y1="148" x2="500" y2="230" stroke="#7a8694" stroke-width="1.6"  marker-end="url(#arr)"/>
